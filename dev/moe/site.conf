upstream vllm_backend {
    zone vllm_backend 64k;

    least_conn;

    # Benchmark mode: keep all backends eligible; bench_vllm.sh gates on /health.
    server 127.0.0.1:8080 max_fails=0;
    server 127.0.0.1:8081 max_fails=0;
    server 127.0.0.1:8082 max_fails=0;
    server 127.0.0.1:8083 max_fails=0;
    server 127.0.0.1:8084 max_fails=0;
    server 127.0.0.1:8085 max_fails=0;
    server 127.0.0.1:8086 max_fails=0;
    server 127.0.0.1:8087 max_fails=0;

    keepalive 128;
}

log_format vllm '$remote_addr - $time_local '
                '"$request" $status $body_bytes_sent '
                'upstream=$upstream_addr '
                'upstream_status=$upstream_status '
                'request_time=$request_time '
                'upstream_response_time=$upstream_response_time';

server {
    listen 80 reuseport;
    server_name _;

    access_log /var/log/nginx/vllm_access.log vllm;
    error_log /var/log/nginx/vllm_error.log warn;

    client_max_body_size 64m;
    keepalive_timeout 75s;
    keepalive_requests 10000;

    location = /check {
        default_type text/plain;
        return 200 "good\n";
    }

    location / {
        proxy_pass http://vllm_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_next_upstream off;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
